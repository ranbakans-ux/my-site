                { sender: '旅仲間Bさん', text: '西門町にあるお店がすごく美味しかったですよ！', time: '12:05' }
            ]);
            const [inputMessage, setInputMessage] = useState('');

            const themeStyles = {
                normal: 'bg-amber-50/80 text-slate-900',
                cool: 'bg-slate-900 text-slate-100',
                cute: 'bg-pink-50 text-slate-900'
            };

            const cardBg = theme === 'cool' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-800 text-slate-900';

            const addExpAndPoints = (amt) => {
                setPoints(p => p + amt);
                setPracticeCount(c => c + 1);
                setEggExp(e => {
                    const next = e + amt * 2;
                    if (next >= 100 && !isHatched) {
                        return 100;
                    }
                    return next >= 100 ? 100 : next;
                });
            };

            const handleHatchCheck = () => {
                if (eggExp >= 100 && !isHatched) {
                    setIsHatched(true);
                    const newReward = `🐣 台湾タピオカハット #${rewards.length + 1}`;
                    setRewards(r => [...r, newReward]);
                    alert("🎉 おめでとうございます！たまごが無事に孵化して、ひよこちゃんが台湾アイテム（タピオカハット）を身につけたピヨ！✨");
                }
            };

            const speakText = (text, isWordOnly = false) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-TW'; 
                    utterance.rate = 0.85;
                    utterance.pitch = 1.1; 
                    utterance.volume = volume / 100;

                    const voices = window.speechSynthesis.getVoices();
                    const googleFemaleVoice = voices.find(v => v.lang === 'zh-TW' && (v.name.includes('Google') || v.name.includes('Female') || v.name.includes('Mei-Jia') || v.name.includes('Yaoyao')));
                    const twVoice = voices.find(v => v.lang === 'zh-TW');

                    if (googleFemaleVoice) {
                        utterance.voice = googleFemaleVoice;
                    } else if (twVoice) {
                        utterance.voice = twVoice;
                    }

                    window.speechSynthesis.speak(utterance);
                    addExpAndPoints(isWordOnly ? 3 : 5);
                } else {
                    alert("お使いのブラウザは音声読み上げに対応していませんピヨ。");
                }
            };

            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
            }, []);

            // 注音クイズの回答判定
            const handleQuizAnswer = (zhuyinOption) => {
                const currentQuiz = ZHUYIN_QUIZZES[quizIndex];
                if (zhuyinOption === currentQuiz.zhuyin) {
                    setQuizFeedback("正解！✨ すごいピヨ！ (+20 EXP)");
                    setQuizScore(s => s + 1);
                    addExpAndPoints(10); // 経験値＆ポイント加算
                    setTimeout(() => {
                        setQuizFeedback('');
                        setQuizIndex((quizIndex + 1) % ZHUYIN_QUIZZES.length);
                    }, 1200);
                } else {
                    setQuizFeedback("惜しい！もう一度チャレンジしてね！💦");
                    speakText(currentQuiz.zh);
                }
            };

            const renderFormattedSentence = () => {
                if (selectedPattern.id === 10) {
                    return <span className="text-orange-600 underline decoration-4 decoration-amber-400">{currentWordObj.zh}</span>;
                }
                if (selectedPattern.id === 7 && currentWordObj.isBreakfastSpecial) {
                    return (
                        <span>
                            請問
                            <span className="text-orange-600 underline decoration-4 decoration-amber-400 bg-amber-100 px-2 py-0.5 rounded-xl mx-1 inline-block">
                                早餐
                            </span>
                            <span className="text-rose-600 font-black bg-rose-100 px-2 py-0.5 rounded-xl mx-1 inline-block">
                                到
                            </span>
                            幾點？
                        </span>
                    );
                }
                if (selectedPattern.id === 7 && currentWordObj.isDepartureSpecial) {
                    return (
                        <span>
                            幾點
                            <span className="text-orange-600 underline decoration-4 decoration-amber-400 bg-amber-100 px-2 py-0.5 rounded-xl mx-1 inline-block">
                                發車
                            </span>
                            ？
                        </span>
                    );
                }
                const formula = selectedPattern.formula; 
                const parts = formula.split('～');
                return (
                    <span>
                        {parts[0]}
                        <span className="text-orange-600 underline decoration-4 decoration-amber-400 bg-amber-100 px-2 py-0.5 rounded-xl mx-1 inline-block">
                            {currentWordObj.zh}
                        </span>
                        {parts[1] || ''}
                    </span>
                );
            };

            const getFullTextPlain = () => {
                if (selectedPattern.id === 10) return currentWordObj.zh;
                if (selectedPattern.id === 7 && currentWordObj.isBreakfastSpecial) return "請問早餐到幾點？";
                if (selectedPattern.id === 7 && currentWordObj.isDepartureSpecial) return "幾點發車？";
                return selectedPattern.formula.replace('～', currentWordObj.zh);
            };

            const handlePatternChange = (pattern) => {
                setSelectedPattern(pattern);
                setCurrentWordObj(pattern.words[0]);
                setShowExplanation(false);
            };

            const handleWordSelect = (wordObj) => {
                setCurrentWordObj(wordObj);
                setShowExplanation(false);
                speakText(wordObj.zh, true);
            };

            const handleAiTranslate = (e) => {
                e.preventDefault();
                const query = aiTranslateInput.trim() || searchQuery.trim();
                if (!query) return;

                setIsAiTranslating(true);
                setAiTranslateResult(null);

                let foundWord = null;
                let foundPattern = null;
                for (const pat of corePatterns) {
                    const matched = pat.words.find(w => w.ja.includes(query) || w.zh.includes(query));
                    if (matched) {
                        foundWord = matched;
                        foundPattern = pat;
                        break;
                    }
                }

                setTimeout(() => {
                    if (foundWord && foundPattern) {
                        setAiTranslateResult({
                            zh: foundPattern.id === 10 ? foundWord.zh : foundPattern.formula.replace('～', foundWord.zh),
                            pinyin: foundWord.pinyin,
                            zhuyin: foundWord.zhuyin,
                            ja: foundWord.trans || foundWord.ja,
                            note: "アプリ内データベースからヒットしたピヨ！"
                        });
                        setSelectedPattern(foundPattern);
                        setCurrentWordObj(foundWord);
                    } else {
                        setAiTranslateResult({
                            zh: `請問「${query}」怎麼說？`,
                            pinyin: "qǐng wèn ... zěn me shuō?",
                            zhuyin: "ㄑㄧㄥˇ ㄨㄣˋ ... ㄗěn ㄇㄜ˙ ㄕㄨㄛ",
                            ja: `「${query}」の台湾華語表現`,
                            note: `✨ AIトリ先生の翻訳解析：台湾旅行で「${query}」を尋ねる際の最適な現地表現を生み出したピヨ！`
                        });
                    }
                    setIsAiTranslating(false);
                    speakText(aiTranslateResult ? aiTranslateResult.zh : query);
                }, 400);
            };

            const changeTip = () => {
                const randomIdx = Math.floor(Math.random() * DYNAMIC_TRIVIA_LIST.length);
                setCurrentTip(DYNAMIC_TRIVIA_LIST[randomIdx]);
            };

            const handleSendPiyotomMessage = (e) => {
                e.preventDefault();
                if (!inputMessage.trim()) return;
                const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const senderName = isAnonymous ? '匿名さん' : (userName.trim() || 'トリさん');
                const newMsg = { sender: senderName, text: inputMessage, time: timeStr };
                setPiyotomMessages(prev => [...prev, newMsg]);
                setInputMessage('');
            };

            const handleSendFeedback = (e) => {
                e.preventDefault();
                if (!feedbackText.trim()) return;
                const newFB = { name: isAnonymous ? '匿名さん' : (userName || 'トリさん'), text: feedbackText, time: 'たった今' };
                setFeedbackList(prev => [newFB, ...prev]);
                setFeedbackText('');
                setFeedbackSent(true);
                setTimeout(() => setFeedbackSent(false), 3000);
            };

            const handleAddCustomWord = (e) => {
                e.preventDefault();
                if (!customZh || !customJa) return;

                const newWord = {
                    zh: customZh,
                    ja: customJa,
                    pinyin: customPinyin || customZh,
                    zhuyin: customZhuyin || 'ㄅㄆㄇ',
                    color: "bg-teal-200 text-teal-950 border-teal-400 hover:bg-teal-300"
                };

                const updatedPatterns = corePatterns.map(pat => {
                    if (pat.id === selectedPattern.id) {
                        return { ...pat, words: [...pat.words, newWord] };
                    }
                    return pat;
                });

                setCorePatterns(updatedPatterns);
                const updatedCurrentPat = updatedPatterns.find(p => p.id === selectedPattern.id);
                setSelectedPattern(updatedCurrentPat);
                setCurrentWordObj(newWord);

                setCustomZh('');
                setCustomJa('');
                setCustomPinyin('');
                setCustomZhuyin('');
                setIsAddingCustomWord(false);
                alert("✨ 新しい単語を登録しましたピヨ！作文マシンで使ってみてね！");

            const renderRuby = (wordObj) => {
                if (rubyType === 'zhuyin') return <span className="text-xs font-bold text-orange-600 bg-amber-100 px-2 py-0.5 rounded-lg border border-slate-800">注音: {wordObj.zhuyin}</span>;
                return <span className="text-xs font-bold text-orange-600 bg-amber-100 px-2 py-0.5 rounded-lg border border-slate-800">ピン音: {wordObj.pinyin}</span>;

                        <div className="bg-white border-3 border-slate-800 rounded-3xl p-6 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] w-full space-y-4">
                            <div>
                                <label className="block text-xs font-black mb-1">お名前（ニックネーム等）</label>
                                <input 
                                    type="text" 
                                    value={userName} 
                                    onChange={(e) => setUserName(e.target.value)} 
                                    placeholder="例: トリさん" 
                                    disabled={isAnonymous}
                                    className="w-full bg-amber-50 border-2 border-slate-800 rounded-2xl px-4 py-2.5 text-xs font-bold disabled:opacity-50 placeholder:text-slate-300"
                                />
                            </div>

                            <div className="flex items-center gap-2">
                                <input 
                                    type="checkbox" 
                                    id="anon" 
                                    checked={isAnonymous} 
                                    onChange={(e) => setIsAnonymous(e.target.checked)} 
                                    className="w-4 h-4 border-2 border-slate-800 rounded"
                                />
                                <label htmlFor="anon" className="text-xs font-bold cursor-pointer">ピヨ友ルームでは「匿名」で参加する</label>
                            </div>

                            <button 
                                onClick={() => setIsSetupDone(true)}
                                className="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-2xl border-2 border-slate-800 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] active:translate-y-0.5 text-sm transition"
                            >
                                学習をスタートする 🚀
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`max-w-2xl mx-auto px-4 py-6 flex flex-col min-h-screen ${themeStyles[theme]}`}>
                    
                    {/* ヘッダー */}
                    <header className={`${cardBg} border-3 border-slate-800 rounded-3xl p-4 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] flex items-center justify-between mb-4`}>
                        <div className="flex items-center space-x-3">
                            <div className="w-16 h-16 bg-amber-300 rounded-full border-3 border-slate-800 flex items-center justify-center overflow-hidden shadow-md shrink-0">
                                <ToriAvatar />
                            </div>
                            <div>
                                <h1 className="text-base font-black tracking-tight">
                                    {isAnonymous ? '匿名さん' : (userName || 'トリさん')}のトリ先生の台湾華語
                                </h1>
                                <div className="flex items-center gap-2 mt-0.5">
                                    {showActivity && (
                                        <p className="text-xs font-bold opacity-80">
                                            発音練習: {practiceCount}回 🔥
                                        </p>
                                    )}
                                    <button 
                                        onClick={() => setIsEditingSettings(true)}
                                        className="text-[10px] bg-amber-100 hover:bg-amber-200 text-slate-900 px-2 py-0.5 rounded-lg border border-slate-800 font-black"
                                    >
                                        ⚙️ 設定
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col items-end gap-2">
                            <div className="bg-orange-500 border-2 border-slate-800 px-3 py-1 rounded-xl text-xs font-black text-white shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                                🪙 {points} pt
                            </div>
                            <div className="flex items-center gap-1">
                                <button onClick={() => setTheme('normal')} className={`px-2 py-0.5 rounded text-[10px] font-bold border border-slate-800 ${theme === 'normal' ? 'bg-amber-400 text-slate-900' : 'bg-white text-slate-600'}`}>ノーマル</button>
                                <button onClick={() => setTheme('cool')} className={`px-2 py-0.5 rounded text-[10px] font-bold border border-slate-800 ${theme === 'cool' ? 'bg-slate-700 text-white' : 'bg-white text-slate-600'}`}>クール</button>
                                <button onClick={() => setTheme('cute')} className={`px-2 py-0.5 rounded text-[10px] font-bold border border-slate-800 ${theme === 'cute' ? 'bg-pink-300 text-slate-900' : 'bg-white text-slate-600'}`}>キュート</button>
                            </div>
                        </div>
                    </header>

                    {/* 詳細設定モーダル */}
                    {isEditingSettings && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white border-3 border-slate-800 rounded-3xl p-6 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] w-full max-w-md space-y-4 text-slate-900 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-base font-black text-center">⚙️ アプリ設定 & カスタマイズ</h3>
                                
                                <div>
                                    <label className="block text-xs font-black mb-1">お名前（ニックネーム等）</label>
                                    <input 
                                        type="text" 
                                        value={userName} 
                                        onChange={(e) => setUserName(e.target.value)} 
                                        placeholder="例: トリさん" 
                                        disabled={isAnonymous}
                                        className="w-full bg-amber-50 border-2 border-slate-800 rounded-2xl px-4 py-2 text-xs font-bold disabled:opacity-50 placeholder:text-slate-300"
                                    />
                                </div>

                                <div className="flex items-center gap-2">
                                    <input 
                                        type="checkbox" 
                                        id="modal-anon" 
                                        checked={isAnonymous} 
                                        onChange={(e) => setIsAnonymous(e.target.checked)} 
                                        className="w-4 h-4 border-2 border-slate-800 rounded"
                                    />
                                    <label htmlFor="modal-anon" className="text-xs font-bold cursor-pointer">ピヨ友ルームでは「匿名」で参加する</label>
                                </div>

                                <hr className="border-slate-300"/>

                                <div>
                                    <label className="block text-xs font-black mb-1">🔊 音声ボリューム設定: {volume}%</label>
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="100" 
                                        value={volume} 
                                        onChange={(e) => setVolume(Number(e.target.value))}
                                        className="w-full accent-orange-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-black mb-1">🎨 育成ルームひよこ背景</label>
                                    <div className="flex gap-2">
                                        <button onClick={() => setActiveBg('bg-amber-300')} className="w-8 h-8 rounded-full bg-amber-300 border-2 border-slate-800"></button>
                                        <button onClick={() => setActiveBg('bg-emerald-300')} className="w-8 h-8 rounded-full bg-emerald-300 border-2 border-slate-800"></button>
                                        <button onClick={() => setActiveBg('bg-sky-300')} className="w-8 h-8 rounded-full bg-sky-300 border-2 border-slate-800"></button>
                                        <button onClick={() => setActiveBg('bg-pink-300')} className="w-8 h-8 rounded-full bg-pink-300 border-2 border-slate-800"></button>
                                    </div>
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={() => setIsEditingSettings(false)}
                                        className="w-full py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-2xl border-2 border-slate-800 text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]"
                                    >
                                        設定を保存して閉じる ✨
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* カスタム単語登録モーダル */}
                    {isAddingCustomWord && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleAddCustomWord} className="bg-white border-3 border-slate-800 rounded-3xl p-6 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] w-full max-w-sm space-y-3 text-slate-900">
                                <h3 className="text-base font-black text-center">✏️ 新しい単語を登録する</h3>
                                <div>
                                    <label className="block text-xs font-black mb-1">台湾華語（漢字）</label>
                                    <input type="text" value={customZh} onChange={(e) => setCustomZh(e.target.value)} placeholder="例：鳳梨酥" required className="w-full bg-amber-50 border-2 border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" />
                                </div>
                                <div>
                                    <label className="block text-xs font-black mb-1">日本語の意味</label>
                                    <input type="text" value={customJa} onChange={(e) => setCustomJa(e.target.value)} placeholder="例：パイナップルケーキ" required className="w-full bg-amber-50 border-2 border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setIsAddingCustomWord(false)} className="flex-1 py-2 bg-slate-200 font-black rounded-xl border-2 border-slate-800 text-xs">キャンセル</button>
                                    <button type="submit" className="flex-1 py-2 bg-orange-500 text-white font-black rounded-xl border-2 border-slate-800 text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">登録する ✨</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* タブ切り替え */}
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-1.5 mb-4">
                        <button 
                            onClick={() => setActiveTab('app')}
                            className={`py-2 px-1 rounded-2xl border-2 border-slate-800 font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition ${activeTab === 'app' ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'}`}
                        >
                            📚 作文
                        </button>
                        <button 
                            onClick={() => setActiveTab('situations')}
                            className={`py-2 px-1 rounded-2xl border-2 border-slate-800 font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition ${activeTab === 'situations' ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'}`}
                        >
                            ✈️ シチュ
                        </button>
                        <button 
                            onClick={() => setActiveTab('rewards')}
                            className={`py-2 px-1 rounded-2xl border-2 border-slate-800 font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition ${activeTab === 'rewards' ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'}`}
                        >
                            🥚 たまご {eggExp >= 100 && !isHatched ? '✨' : ''}
                        </button>
                        <button 
                            onClick={() => setActiveTab('piyotom')}
                            className={`py-2 px-1 rounded-2xl border-2 border-slate-800 font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition ${activeTab === 'piyotom' ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'}`}
                        >
                            💬 ピヨ友
                        </button>
                        <button 
                            onClick={() => setActiveTab('feedback')}
                            className={`py-2 px-1 rounded-2xl border-2 border-slate-800 font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition ${activeTab === 'feedback' ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'}`}
                        >
                            💡 意見箱
                        </button>
                    </div>

                    {/* ご意見ボックス */}
                    {activeTab === 'feedback' && (
                        <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] flex flex-col space-y-4 flex-1`}>
                            <div className="border-b-2 border-slate-200 pb-3">
                                <h2 className="text-base font-black mb-1">💡 ご意見・改善案ボックス</h2>
                                <p className="text-xs opacity-80">今後のアプリ改善のために、ご要望や感想をぜひ教えてくださいピヨ！</p>
                            </div>

                            <form onSubmit={handleSendFeedback} className="space-y-3">
                                <textarea 
                                    rows="3"
                                    value={feedbackText}
                                    onChange={(e) => setFeedbackText(e.target.value)}
                                    placeholder="例：こんな機能がほしい、ここを直してほしい、など..."
                                    className="w-full bg-amber-50/70 border-2 border-slate-800 rounded-2xl p-3 text-xs font-bold text-slate-900 focus:outline-none"
                                ></textarea>
                                <button type="submit" className="w-full py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-2xl border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] text-xs">
                                    改善案を送信する 🚀
                                </button>
                                {feedbackSent && <div className="text-xs text-emerald-600 font-black text-center">✨ ご意見ありがとうございます！送信完了しました！</div>}

                                <div className="text-xs font-black opacity-70 uppercase">みんなからのご意見・コメント</div>
                                {feedbackList.map((fb, i) => (
                                    <div key={i} className="bg-amber-50 border-2 border-slate-800 rounded-2xl p-3 text-xs">
                                        <div className="flex justify-between font-bold text-[10px] opacity-70 mb-1">
                                            <span>{fb.name}</span>
                                            <span>{fb.time}</span>
                                        </div>
                                        <div className="font-bold text-slate-900">{fb.text}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* たまご育成ルーム（注音練習機能付き！） */}
                    {activeTab === 'rewards' && (
                        <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-6 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] space-y-6 flex-1`}>
                            <div className="text-center">
                                <h2 className="text-lg font-black mb-1">🐣 たまご育成 ＆ 注音（ㄅㄆㄇ）トレーニング</h2>
                                <p className="text-xs opacity-80">クイズに正解して注音を覚えながら、たまごを孵化させよう！</p>
                            </div>

                            <div className="bg-amber-50 border-3 border-slate-800 rounded-3xl p-6 text-center shadow-inner space-y-3">
                                <CuteHatchling hatItem={isHatched ? '🧋' : null} bgStyle={activeBg} />
                                <div className="text-xs font-black text-slate-800">たまごの成長ゲージ</div>
                                <div className="w-full bg-white border-2 border-slate-800 rounded-full h-5 overflow-hidden p-0.5">
                                    <div className="bg-orange-500 h-full rounded-full transition-all duration-500" style={{ width: `${eggExp}%` }}></div>
                                </div>
                                <div className="text-xs font-bold text-slate-800">{eggExp} / 100 EXP</div>

                                {eggExp >= 100 && !isHatched && (
                                    <button 
                                        onClick={handleHatchCheck}
                                        className="mt-2 px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-black rounded-2xl border-2 border-slate-800 shadow-[3px_3px_0px_0px_rgba(15,23,42,1)] animate-pulse text-sm"
                                    >
                                        🎉 たまごを孵化させる！
                                    </button>
                                )}
                            </div>

                            {/* 注音（ㄅㄆㄇ）クイズ道場 */}
                            <div className="bg-white border-3 border-slate-800 rounded-3xl p-5 shadow-[3px_3px_0px_0px_rgba(15,23,42,1)] space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-black uppercase text-orange-600">🎯 注音（ㄅㄆㄇ）当てクイズ道場</h3>
                                    <span className="text-xs font-bold">正解数: {quizScore}問 🔥</span>
                                </div>

                                <div className="bg-amber-50 border-2 border-slate-800 rounded-2xl p-4 text-center space-y-2">
                                    <div className="text-xs font-bold text-slate-600">この単語の正しい「注音」はどれ？</div>
                                    <div className="text-2xl font-black text-slate-900">{ZHUYIN_QUIZZES[quizIndex].zh} <span className="text-sm opacity-70">({ZHUYIN_QUIZZES[quizIndex].hint})</span></div>
                                    
                                    <div className="grid grid-cols-1 gap-2 pt-2">
                                        {ZHUYIN_QUIZZES.map((q, idx) => (
                                            <button 
                                                key={idx}
                                                onClick={() => handleQuizAnswer(q.zhuyin)}
                                                className="bg-white hover:bg-amber-100 border-2 border-slate-800 p-2.5 rounded-xl text-xs font-black shadow-[1px_1px_0px_0px_rgba(15,23,42,1)] transition active:translate-y-0.5"
                                            >
                                                {q.zhuyin} （{q.hint}）
                                            </button>
                                        ))}
                                    </div>
                                    {quizFeedback && <div className="text-xs font-black text-rose-600 pt-1">{quizFeedback}</div>}
                                </div>
                            </div>

                            <div>
                                <h3 className="text-xs font-black uppercase tracking-wider mb-3">🎁 獲得した台湾アイテムコレクション ({rewards.length})</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {rewards.map((r, i) => (
                                        <div key={i} className="bg-amber-100 border-2 border-slate-800 rounded-2xl p-3 text-xs font-bold text-slate-900 flex items-center gap-2 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                                            <span>🧋</span>
                                            <span>{r}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* シチュエーションルーム */}
                    {activeTab === 'situations' && (
                        <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-6 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] space-y-6 flex-1`}>
                            <div className="text-center">
                                <h2 className="text-lg font-black mb-1">✈️ シチュエーション別 台湾華語</h2>
                                <p className="text-xs opacity-80">台湾旅行の場面ごとにすぐ使える実践フレーズ集ピヨ！</p>
                            </div>

                            <div className="space-y-4">
                                {SITUATIONS.map((sit, idx) => (
                                    <div key={idx} className="bg-amber-50/70 border-2 border-slate-800 rounded-2xl p-4 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                                        <h3 className="text-sm font-black mb-2 text-slate-900">{sit.title}</h3>
                                        <div className="space-y-2">
                                            {sit.phrases.map((p, pIdx) => (
                                                <div key={pIdx} className="bg-white border border-slate-800 rounded-xl p-2.5 flex items-center justify-between text-xs">
                                                    <div>
                                                        <div className="font-black text-sm text-slate-900">{p.zh}</div>
                                                        <div className="text-[10px] text-orange-600 font-bold">{p.pinyin}</div>
                                                        <div className="text-[11px] text-slate-700 font-bold">{p.ja}</div>
                                                    </div>
                                                    <button 
                                                        onClick={() => speakText(p.zh, false)}
                                                        className="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1.5 rounded-xl font-black text-xs border border-slate-800 shadow-[1px_1px_0px_0px_rgba(15,23,42,1)] shrink-0"
                                                    >
                                                        🔊 聴く
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ピヨ友ルーム */}
                    {activeTab === 'piyotom' && (
                        <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] flex flex-col h-[520px]`}>
                            <div className="border-b-2 border-slate-200 pb-3 mb-3">
                                <h2 className="text-base font-black mb-1">💬 ピヨ友ルーム（旅仲間チャット）</h2>
                                <p className="text-[11px] text-rose-600 font-bold bg-rose-50 border border-rose-200 rounded-xl p-2">
                                    ⚠️ ご注意：ルーム内での会話やトラブル等につきまして、トリ先生および運営は一切関与いたしません。すべて個人の責任においてご利用ください。
                                </p>
                            </div>

                            <div className="flex-1 overflow-y-auto space-y-3 pr-2 mb-3">
                                {piyotomMessages.map((msg, idx) => (
                                    <div key={idx} className={`p-3 rounded-2xl border-2 border-slate-800 text-xs ${msg.sender === (isAnonymous ? '匿名さん' : (userName || 'トリさん')) ? 'bg-amber-100 text-slate-900 ml-4' : 'bg-white text-slate-900 mr-4'}`}>
                                        <div className="flex justify-between font-bold mb-1 text-[10px] opacity-70">
                                            <span>{msg.sender}</span>
                                            <span>{msg.time}</span>
                                        </div>
                                        <div className="font-bold text-sm">{msg.text}</div>
                                    </div>
                                ))}
                            </div>

                            <form onSubmit={handleSendPiyotomMessage} className="flex gap-2">
                                <input 
                                    type="text" 
                                    value={inputMessage}
                                    onChange={(e) => setInputMessage(e.target.value)}
                                    placeholder="ピヨ友にメッセージを送る..." 
                                    className="flex-1 bg-white border-2 border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-slate-900 font-bold focus:outline-none"
                                />
                                <button type="submit" className="bg-orange-500 text-white font-black px-5 py-2.5 rounded-2xl border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] active:translate-y-0.5">
                                    送信 🚀
                                </button>
                            </form>
                        </div>
                    )}

                    {/* 学習ルーム（AI翻訳機付き作文マシン） */}
                    {activeTab === 'app' && (
                        <div className="space-y-4 flex-1 flex flex-col">
                            
                            {/* AI翻訳機検索バー */}
                            <form onSubmit={handleAiTranslate} className={`${cardBg} border-3 border-slate-800 rounded-3xl p-4 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] space-y-2`}>
                                <div className="text-xs font-black flex items-center justify-between">
                                    <span>🌐 AIリアルタイム翻訳機（台湾華語・発音変換）</span>
                                    <span className="text-[10px] bg-orange-500 text-white px-2 py-0.5 rounded border border-slate-800">AI機能搭載</span>
                                </div>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={aiTranslateInput}
                                        onChange={(e) => setAiTranslateInput(e.target.value)}
                                        placeholder="🔍 日本語や単語を入力（例：クレジットカード, トイレ, 予約...）" 
                                        className="flex-1 bg-amber-50/50 border-2 border-slate-800 rounded-2xl px-4 py-2.5 text-xs font-bold focus:outline-none text-slate-900 placeholder:text-slate-400"
                                    />
                                    <button type="submit" disabled={isAiTranslating} className="bg-orange-500 hover:bg-orange-600 text-white font-black px-5 py-2.5 rounded-2xl border-2 border-slate-800 text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] active:translate-y-0.5 disabled:opacity-50">
                                        {isAiTranslating ? '翻訳中...' : 'AI翻訳 ✨'}
                                    </button>
                                </div>

                                {aiTranslateResult && (
                                    <div className="bg-amber-50 border-2 border-slate-800 rounded-2xl p-4 mt-3 space-y-2 animate-fade-in shadow-inner">
                                        <div className="text-[11px] font-black text-orange-600">{aiTranslateResult.note}</div>
                                        <div className="text-2xl font-black text-slate-900">{aiTranslateResult.zh}</div>
                                        <div className="flex flex-wrap gap-2 text-xs font-bold">
                                            <span className="bg-amber-200 text-slate-900 px-2 py-0.5 rounded border border-slate-700">ピン音: {aiTranslateResult.pinyin}</span>
                                            <span className="bg-amber-200 text-slate-900 px-2 py-0.5 rounded border border-slate-700">注音: {aiTranslateResult.zhuyin}</span>
                                        </div>
                                        <div className="flex items-center justify-between pt-2 border-t border-slate-300">
                                            <span className="text-xs font-bold text-slate-700">意味: {aiTranslateResult.ja}</span>
                                            <button 
                                                type="button" 
                                                onClick={() => speakText(aiTranslateResult.zh, false)}
                                                className="bg-slate-900 text-white px-3 py-1.5 rounded-xl font-black text-xs border border-slate-800 shadow-[1px_1px_0px_0px_rgba(15,23,42,1)]"
                                            >
                                                🔊 発音を聴く
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </form>

                            {/* トリ先生の最新台湾トリビア */}
                            <div className="bg-amber-100 border-3 border-slate-800 rounded-3xl p-4 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] flex items-start gap-3 relative cursor-pointer" onClick={changeTip}>
                                <div className="w-12 h-12 bg-amber-300 rounded-full border-2 border-slate-800 flex items-center justify-center overflow-hidden shrink-0 shadow-sm">
                                    <ToriAvatar />
                                </div>
                                <div className="flex-1">
                                    <div className="text-xs font-black text-slate-900 mb-0.5">トリ先生の台湾トリビア（タップで最新情報に更新✨）</div>
                                    <div className="text-xs font-bold text-slate-800 leading-relaxed">{currentTip}</div>
                                </div>
                            </div>

                            {/* 1. 完成の文 */}
                            <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]`}>
                                <div className="flex items-center justify-between mb-3">
                                    <span className={`text-xs font-black px-3 py-1 rounded-full text-white ${selectedPattern.color} border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]`}>
                                        {selectedPattern.name}
                                    </span>
                                    
                                    <div className="flex gap-1">
                                        <button onClick={() => setRubyType('pinyin')} className={`px-2.5 py-1 rounded-lg text-xs font-black border-2 border-slate-800 ${rubyType === 'pinyin' ? 'bg-orange-500 text-white' : 'bg-amber-50 text-slate-800'}`}>ピン音</button>
                                        <button onClick={() => setRubyType('zhuyin')} className={`px-2.5 py-1 rounded-lg text-xs font-black border-2 border-slate-800 ${rubyType === 'zhuyin' ? 'bg-orange-500 text-white' : 'bg-amber-50 text-slate-800'}`}>注音</button>
                                    </div>
                                </div>

                                <div className="my-3">
                                    <div className="mb-1">{renderRuby(currentWordObj)}</div>
                                    <div className="text-3xl font-black tracking-wide">
                                        {renderFormattedSentence()}
                                    </div>
                                </div>

                                <div className="flex items-center justify-between pt-3 border-t border-slate-200">
                                    <div className="text-xs font-bold">
                                        日本語訳: <span className="text-sm font-extrabold">{currentWordObj.trans}</span>
                                    </div>
                                    <button
                                        onClick={() => speakText(getFullTextPlain(), false)}
                                        className="bg-orange-500 hover:bg-orange-600 text-white border-2 border-slate-800 px-4 py-2.5 rounded-2xl font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] flex items-center gap-1.5 active:translate-y-0.5 transition shrink-0"
                                    >
                                        <span>🔊</span> 全体の発音 (+5pt)
                                    </button>
                                </div>
                            </div>

                            {/* 2. 単語の入れ替え選択 */}
                            <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]`}>
                                <div className="text-xs font-black opacity-70 uppercase tracking-wider mb-3 flex items-center justify-between">
                                    <span>👇 単語をタップして入れ替え</span>
                                    <button 
                                        onClick={() => setIsAddingCustomWord(true)}
                                        className="text-[10px] bg-orange-500 text-white px-2.5 py-1 rounded-xl border border-slate-800 font-black shadow-[1px_1px_0px_0px_rgba(15,23,42,1)]"
                                    >
                                        ＋ 新しい単語を登録
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                                    {selectedPattern.words.map((w, idx) => {
                                        const isSelected = currentWordObj.zh === w.zh;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => handleWordSelect(w)}
                                                className={`p-3 rounded-2xl border-2 transition active:translate-y-0.5 text-left ${w.color || 'bg-amber-100 text-slate-900 border-slate-300'} ${
                                                    isSelected 
                                                        ? 'ring-4 ring-slate-900 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-black scale-105' 
                                                        : 'shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-bold'
                                                }`}
                                            >
                                                <div className="text-sm truncate">{w.zh}</div>
                                                <div className="text-[10px] truncate opacity-80">{w.ja}</div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 3. 定型文選択 */}
                            <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]`}>
                                <div className="text-xs font-black opacity-70 uppercase tracking-wider mb-3">
                                    🎯 10の基本型を選ぶ
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    {corePatterns.map((pattern) => {
                                        const isSelected = selectedPattern.id === pattern.id;
                                        return (
                                            <button
                                                key={pattern.id}
                                                onClick={() => handlePatternChange(pattern)}
                                                className={`p-3 rounded-2xl border-2 border-slate-800 text-left transition active:translate-y-0.5 flex items-center justify-between ${
                                                    isSelected 
                                                        ? 'bg-slate-900 text-white shadow-[3px_3px_0px_0px_rgba(15,23,42,1)] font-black' 
                                                        : 'bg-white hover:bg-amber-100 text-slate-900 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-bold'
                                                }`}
                                            >
                                                <span className="text-xs truncate pr-2">{pattern.name}</span>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-lg shrink-0 border border-slate-800 ${isSelected ? 'bg-orange-500 text-white' : pattern.lightColor}`}>
                                                    {pattern.formula.split('～')[0]}~
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
