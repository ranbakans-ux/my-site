        function App() {
            const [selectedPattern, setSelectedPattern] = useState(CORE_PATTERNS[0]);
            const [currentWordObj, setCurrentWordObj] = useState(CORE_PATTERNS[0].words[0]);
            
            const [rubyType, setRubyType] = useState('pinyin');

            const [inputMessage, setInputMessage] = useState('');

            const themeStyles = {

            const cardBg = theme === 'cool' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-800 text-slate-900';

            const addExpAndPoints = (amt) => {
                setPoints(p => p + amt);
                setEggExp(e => {
                    const next = e + amt * 2;
                    if (next >= 100) {
                        alert("🎉 おめでとうございます！たまごが孵化して新しい特典アイテムをゲットしましたピヨ！🐣");
                        setRewards(r => [...r, `とり先生の限定バッジ #${r.length + 1}`]);
                        return 0;
                    }
                    return next;
                });
            };

            // Googleの綺麗な女性音声（台湾華語: zh-TW）を優先選択して読み上げる関数
            const speakText = (text, isWordOnly = false) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-TW'; 
                    utterance.rate = 0.85;
                    utterance.pitch = 1.1; // 明るく綺麗な女性トーン

                    const voices = window.speechSynthesis.getVoices();
                    const googleFemaleVoice = voices.find(v => v.lang === 'zh-TW' && (v.name.includes('Google') || v.name.includes('Female') || v.name.includes('Mei-Jia') || v.name.includes('Yaoyao')));
                    const twVoice = voices.find(v => v.lang === 'zh-TW');

                    if (googleFemaleVoice) {
                        utterance.voice = googleFemaleVoice;
                    } else if (twVoice) {
                        utterance.voice = twVoice;
                    }

                    window.speechSynthesis.speak(utterance);
                    addExpAndPoints(isWordOnly ? 3 : 5);
                } else {
                    alert("お使いのブラウザは音声読み上げに対応していませんピヨ。");
                }
            };

            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
            }, []);

            const getFullSentence = () => {
                if (selectedPattern.id === 10) {
                    return `${currentWordObj.zh}很好吃！`;
                }
                return selectedPattern.formula.replace('～', currentWordObj.zh);
            };

            const handlePatternChange = (pattern) => {
                setSelectedPattern(pattern);
                setCurrentWordObj(pattern.words[0]);
                setShowExplanation(false);
            };

            const handleWordSelect = (wordObj) => {
                setCurrentWordObj(wordObj);
                setShowExplanation(false);
                speakText(wordObj.zh, true);
            };

            const handleSearch = (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) return;

                let foundWord = null;
                let foundPattern = null;

                for (const pat of CORE_PATTERNS) {
                    const matched = pat.words.find(w => w.ja.includes(searchQuery) || w.zh.includes(searchQuery));
                    if (matched) {
                        foundWord = matched;
                        foundPattern = pat;
                        break;
                    }
                }

                if (foundWord && foundPattern) {
                    setSelectedPattern(foundPattern);
                    setCurrentWordObj(foundWord);
                    setSearchResult(null);
                    setSearchQuery('');
                    speakText(foundPattern.id === 10 ? `${foundWord.zh}很好吃！` : foundPattern.formula.replace('～', foundWord.zh));
                } else {
                    setSearchResult("該当する単語が見つからなかったピヨ…別の言葉で探してみてね！");
                }
            };

                const randomIdx = Math.floor(Math.random() * TIPS_LIST.length);
                setCurrentTip(TIPS_LIST[randomIdx]);
            };

            const handleSendPiyotomMessage = (e) => {
                e.preventDefault();
                if (!inputMessage.trim()) return;
                const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const newMsg = { sender: 'あなた', text: inputMessage, time: timeStr };

                                <div className="flex gap-2">

                                        onChange={(e) => setSearchQuery(e.target.value)}

                                        className="flex-1 bg-amber-50/50 border-2 border-slate-800 rounded-2xl px-4 py-2.5 text-xs font-bold focus:outline-none text-slate-900"
                                    />
                                    <button type="submit" className="bg-slate-900 text-white font-black px-5 py-2.5 rounded-2xl border-2 border-slate-800 text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] active:translate-y-0.5">
                                        検索

                                </div>
                                {searchResult && <div className="text-xs text-rose-600 font-bold mt-2">{searchResult}</div>}
                            </form>

                            {/* とり先生の豆知識 */}

                                <div className="w-12 h-12 bg-amber-300 rounded-full border-2 border-slate-800 flex items-center justify-center overflow-hidden shrink-0 shadow-sm">
                                    <ToriAvatar />
                                </div>
                                <div className="flex-1">
                                    <div className="text-xs font-black text-slate-900 mb-0.5">とり先生の台湾トリビア（タップで次へ）</div>

                                </div>

                                <div className="flex items-center justify-between mb-3">
                                    <span className={`text-xs font-black px-3 py-1 rounded-full text-white ${selectedPattern.color} border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]`}>
                                        {selectedPattern.name}
                                    </span>
                                    
                                    <div className="flex gap-1">
                                        <button onClick={() => setRubyType('pinyin')} className={`px-2.5 py-1 rounded-lg text-xs font-black border-2 border-slate-800 ${rubyType === 'pinyin' ? 'bg-orange-500 text-white' : 'bg-amber-50 text-slate-800'}`}>ピン音</button>

                                    </div>
                                </div>

                                <div className="my-3">
                                    <div className="mb-1">{renderRuby(currentWordObj)}</div>
                                    <div className="text-3xl font-black tracking-wide">
                                        {getFullSentence()}
                                    </div>
                                </div>

                                <div className="flex items-center justify-between pt-3 border-t border-slate-200">
                                    <div className="text-xs font-bold">
                                        日本語訳: <span className="text-sm font-extrabold">{currentWordObj.trans}</span>
                                    </div>
                                    <button
                                        onClick={() => speakText(getFullSentence(), false)}
                                        className="bg-orange-500 hover:bg-orange-600 text-white border-2 border-slate-800 px-4 py-2.5 rounded-2xl font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] flex items-center gap-1.5 active:translate-y-0.5 transition shrink-0"
                                    >
                                        <span>🔊</span> 全体の発音 (+5pt)
                                    </button>
                                </div>

                                <div className="mt-3 pt-3 border-t border-dashed border-slate-300">
                                    <button 
                                        onClick={() => setShowExplanation(!showExplanation)}
                                        className="w-full py-2 bg-amber-100 hover:bg-amber-200 text-slate-900 font-black rounded-xl border-2 border-slate-800 text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition"
                                    >
                                        {showExplanation ? '▲ 解説を閉じる' : '💡 教えて先生！なぜこの表現になるの？'}
                                    </button>

                                    {showExplanation && (
                                        <div className="mt-3 bg-amber-50 border-2 border-slate-800 rounded-2xl p-4 text-xs font-bold text-slate-900 leading-relaxed shadow-inner">
                                            <p className="font-black text-orange-600 mb-1">🎓 とり先生のシンプル解説ピヨ！</p>
                                            基本の型（<span className="underline">{selectedPattern.formula}</span>）の「〜」に単語を入れ替えるだけで完璧に通じるよ！単語をタップすると「単語だけの発音」も聞けるから耳を慣らしてみてね！
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 2. 単語の入れ替え選択 */}
                            <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]`}>
                                <div className="text-xs font-black opacity-70 uppercase tracking-wider mb-3 flex items-center justify-between">
                                    <span>👇 単語をタップして入れ替え（色分け連動）</span>
                                    <span className="text-[10px] text-orange-600 bg-amber-100 px-2 py-0.5 rounded border border-slate-800">タップで単語音声</span>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                                    {selectedPattern.words.map((w, idx) => {
                                        const isSelected = currentWordObj.zh === w.zh;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => handleWordSelect(w)}
                                                className={`p-3 rounded-2xl border-2 border-slate-800 text-left transition active:translate-y-0.5 ${
                                                    isSelected 
                                                        ? `${selectedPattern.color} text-white shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-black ring-2 ring-white` 
                                                        : 'bg-white hover:bg-amber-50 text-slate-900 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-bold'
                                                }`}
                                            >
                                                <div className="text-sm truncate">{w.zh}</div>
                                                <div className={`text-[10px] truncate ${isSelected ? 'text-white/90' : 'opacity-70'}`}>{w.ja}</div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 3. 定型文（10型選択） */}
                            <div className={`${cardBg} border-3 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]`}>
                                <div className="text-xs font-black opacity-70 uppercase tracking-wider mb-3">
                                    🎯 10の基本型を選ぶ
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    {CORE_PATTERNS.map((pattern) => {
                                        const isSelected = selectedPattern.id === pattern.id;
                                        return (
                                            <button
                                                key={pattern.id}
                                                onClick={() => handlePatternChange(pattern)}
                                                className={`p-3 rounded-2xl border-2 border-slate-800 text-left transition active:translate-y-0.5 flex items-center justify-between ${
                                                    isSelected 
                                                        ? 'bg-slate-900 text-white shadow-[3px_3px_0px_0px_rgba(15,23,42,1)] font-black' 
                                                        : 'bg-white hover:bg-amber-100 text-slate-900 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-bold'
                                                }`}
                                            >
                                                <span className="text-xs truncate pr-2">{pattern.name}</span>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-lg shrink-0 border border-slate-800 ${isSelected ? 'bg-orange-500 text-white' : `${pattern.lightColor} text-slate-900`}`}>
                                                    {pattern.formula.split('～')[0]}~
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
