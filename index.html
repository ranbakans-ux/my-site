                        alert("🎉 おめでとうございます！たまごが孵化して新しい特典アイテムをゲットしましたピヨ！🐣");

                        return 0;

                    return next;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);

                    utterance.rate = 0.85;     // 聞き取りやすい少しゆっくりめのスピード
                    utterance.pitch = 1.0;
                    window.speechSynthesis.speak(utterance);
                    addExpAndPoints(5);
                } else {
                    alert("お使いのブラウザは音声読み上げに対応していませんピヨ。");
                }
            };

                    return `${currentWordObj.zh}很好吃！`;

                return selectedPattern.formula.replace('～', currentWordObj.zh);
            };

                setSelectedPattern(pattern);
                setCurrentWordObj(pattern.words[0]);
            };

                                    100単語でつくるトラベル作文マシン 🐣
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => setActiveTab(activeTab === 'app' ? 'rewards' : 'app')}
                                className="bg-amber-100 hover:bg-amber-200 border-2 border-slate-800 px-3 py-1.5 rounded-xl text-xs font-black text-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] transition active:translate-y-0.5"
                            >
                                {activeTab === 'app' ? '🥚 たまご育成' : '📚 学習に戻る'}
                            </button>
                            <div className="bg-orange-400 border-2 border-slate-800 px-3 py-1.5 rounded-xl text-xs font-black text-white shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                                🪙 {points} pt
                            </div>
                        </div>
                    </header>

                    {activeTab === 'rewards' ? (
                        /* Rewards & Egg Room */
                        <div className="bg-white border-2 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] space-y-5 flex-1">
                            <div className="text-center">
                                <h2 className="text-lg font-black text-slate-800 mb-1">🐣 とり先生のたまご育成ルーム</h2>
                                <p className="text-xs text-slate-500">練習すればするほどたまごが育ち、楽しい特典がもらえるピヨ！</p>
                            </div>

                            <div className="bg-amber-50 border-2 border-slate-800 rounded-2xl p-5 text-center shadow-inner">
                                <div className="text-6xl mb-2 animate-bounce">🥚</div>
                                <div className="text-xs font-black text-slate-700 mb-2">たまごの成長ゲージ</div>
                                <div className="w-full bg-white border-2 border-slate-800 rounded-full h-4 overflow-hidden p-0.5">
                                    <div className="bg-orange-500 h-full rounded-full transition-all duration-500" style={{ width: `${eggExp}%` }}></div>
                                </div>
                                <div className="text-xs font-bold text-slate-600 mt-2">{eggExp} / 100 EXP (あと {100 - eggExp} EXPで孵化！)</div>
                            </div>

                            <div>
                                <h3 className="text-xs font-black text-slate-600 uppercase tracking-wider mb-3">🎁 獲得した特典コレクション ({rewards.length})</h3>
                                <div className="grid grid-cols-2 gap-2">
                                    {rewards.map((r, i) => (
                                        <div key={i} className="bg-amber-100/60 border-2 border-slate-800 rounded-xl p-3 text-xs font-bold text-slate-800 flex items-center gap-2 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                                            <span>⭐</span>
                                            <span>{r}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button 
                                onClick={() => setActiveTab('app')}
                                className="w-full py-3 bg-slate-900 text-white font-black rounded-2xl border-2 border-slate-800 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)] hover:bg-slate-800 transition active:translate-y-0.5 text-sm"
                            >
                                学習に戻る 🚀
                            </button>
                        </div>
                    ) : (
                        /* Main Application Layout */
                        <div className="space-y-4 flex-1 flex flex-col">
                            {/* 1. 完成の文（一番上） */}
                            <div className="bg-white border-2 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs font-black px-3 py-1 rounded-full text-white bg-rose-500 border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)]">
                                        {selectedPattern.name}
                                    </span>
                                    <span className="text-xs font-bold text-slate-500 bg-amber-100 px-2.5 py-0.5 rounded-lg border border-slate-800">
                                        ピンイン: {currentWordObj.pinyin}
                                    </span>
                                </div>

                                <div className="text-2xl sm:text-3xl font-black text-slate-900 my-3 tracking-wide">
                                    {getFullSentence()}
                                </div>

                                <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                                    <div className="text-sm font-bold text-slate-600">
                                        日本語訳: <span className="text-slate-900 font-extrabold">{currentWordObj.trans}</span>
                                    </div>
                                    <button
                                        onClick={() => speakText(getFullSentence())}
                                        className="bg-orange-500 hover:bg-orange-600 text-white border-2 border-slate-800 px-4 py-2 rounded-2xl font-black text-xs shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] flex items-center gap-1.5 active:translate-y-0.5 transition shrink-0"
                                    >
                                        <span>🔊</span> 発音を聞く (+5pt)
                                    </button>
                                </div>
                            </div>

                            {/* 2. 単語の入れ替え選択 */}
                            <div className="bg-white border-2 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
                                <div className="text-xs font-black text-slate-400 uppercase tracking-wider mb-3">
                                    👇 単語をタップして入れ替え（選んだ単語の日本語訳に連動します）
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                                    {selectedPattern.words.map((w, idx) => {
                                        const isSelected = currentWordObj.zh === w.zh;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => handleWordSelect(w)}
                                                className={`p-3 rounded-2xl border-2 border-slate-800 text-left transition active:translate-y-0.5 ${
                                                    isSelected 
                                                        ? 'bg-rose-500 text-white shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-black' 
                                                        : 'bg-white hover:bg-amber-50 text-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-bold'
                                                }`}
                                            >
                                                <div className="text-sm truncate">{w.zh}</div>
                                                <div className={`text-[10px] truncate ${isSelected ? 'text-white/90' : 'text-slate-400'}`}>{w.ja}</div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 3. 定型文（10型選択） */}
                            <div className="bg-white border-2 border-slate-800 rounded-3xl p-5 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
                                <div className="text-xs font-black text-slate-400 uppercase tracking-wider mb-3">
                                    🎯 10の基本型を選ぶ
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    {CORE_PATTERNS.map((pattern) => {
                                        const isSelected = selectedPattern.id === pattern.id;
                                        return (
                                            <button
                                                key={pattern.id}
                                                onClick={() => handlePatternChange(pattern)}
                                                className={`p-3 rounded-2xl border-2 border-slate-800 text-left transition active:translate-y-0.5 flex items-center justify-between ${
                                                    isSelected 
                                                        ? 'bg-slate-900 text-white shadow-[3px_3px_0px_0px_rgba(15,23,42,1)] font-black' 
                                                        : 'bg-amber-50/70 hover:bg-amber-100 text-slate-800 shadow-[2px_2px_0px_0px_rgba(15,23,42,1)] font-bold'
                                                }`}
                                            >
                                                <span className="text-xs truncate pr-2">{pattern.name}</span>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-lg shrink-0 border border-slate-800 ${isSelected ? 'bg-orange-500 text-white' : 'bg-white text-slate-700'}`}>
                                                    {pattern.formula.split('～')[0]}~
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
